version: '3.8'

services:
  sdm-app:
    container_name: sdm-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAABnQ7KZ335kF5jw7
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
    image: sdm-app:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=${APP_PORT:-3002}
      - HOSTNAME=0.0.0.0
      - TZ=Asia/Jakarta
      - INTERNAL_BACKEND_URL=${INTERNAL_BACKEND_URL:-http://127.0.0.1:3001}
    volumes:
      - ./uploads:/app/uploads
      - ./public/photos:/app/public/photos
      - ./public/uploads:/app/public/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:\" + (process.env.PORT || 3002) + \"/api/health\", (r) => {if (r.statusCode !== 200) process.exit(1);})'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s